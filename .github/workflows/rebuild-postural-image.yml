name: Rebuild Postural Cover
on:
  push:
    paths:
      - ".tmp/postural800_08.b64"
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode higher quality cover
        run: |
          cat .tmp/postural800_00.b64 .tmp/postural800_01.b64 .tmp/postural800_02.b64 .tmp/postural800_03.b64 .tmp/postural800_04.b64 .tmp/postural800_05.b64 .tmp/postural800_06.b64 .tmp/postural800_07.b64 .tmp/postural800_08.b64 | base64 --decode > assets/athletic-postural-stability-cover.webp
          rm -f .tmp/postural800_*.b64
      - name: Commit restored image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/athletic-postural-stability-cover.webp .tmp
          git commit -m "Restore high quality postural stability cover" || exit 0
          git push
