<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Ejercicio aeróbico, menopausia e hipertensión</title>
<desc id="desc">Ilustración editorial de dos mujeres adultas realizando ejercicio aeróbico con elementos de presión arterial, corazón y electrocardiograma.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eef8fb"/>
    <stop offset="0.55" stop-color="#dceff4"/>
    <stop offset="1" stop-color="#c6e2e9"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".96"/>
    <stop offset="1" stop-color="#e9f4f7" stop-opacity=".92"/>
  </linearGradient>
  <linearGradient id="shirt1" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b5d83"/>
    <stop offset="1" stop-color="#123f68"/>
  </linearGradient>
  <linearGradient id="shirt2" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3e8f9a"/>
    <stop offset="1" stop-color="#1e6876"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#16445c" flood-opacity=".18"/>
  </filter>
</defs>

<rect width="1440" height="900" fill="url(#bg)"/>
<path d="M0 660 C210 560 330 730 525 650 C730 565 820 760 1030 655 C1190 575 1295 610 1440 535 L1440 900 L0 900 Z" fill="#99cbd5" opacity=".30"/>
<path d="M0 715 C210 635 400 795 600 690 C805 580 1000 790 1440 620 L1440 900 L0 900 Z" fill="#6fb3c1" opacity=".22"/>

<!-- area label -->
<g transform="translate(42 36)" filter="url(#shadow)">
  <rect width="292" height="64" rx="18" fill="#0c3d68"/>
  <circle cx="34" cy="32" r="18" fill="#2b8ea0"/>
  <path d="M25 39c13-18 18-20 28-22M27 22l11 7-5 14M39 29l14 10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <text x="68" y="41" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" letter-spacing="1.5" fill="#fff">HEALTH SCIENCES</text>
</g>

<!-- clinical panel -->
<g transform="translate(915 155)" filter="url(#shadow)">
  <rect width="430" height="500" rx="34" fill="url(#panel)" stroke="#9bcbd4" stroke-width="3"/>
  <text x="40" y="62" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#143f5f">Respuesta cardiovascular</text>

  <g transform="translate(48 100)">
    <circle cx="74" cy="74" r="68" fill="#edf7f9" stroke="#7ab7c4" stroke-width="5"/>
    <path d="M47 67c-18-23-44 4-33 24 13 23 33 31 33 31s21-8 34-31c11-20-15-47-34-24z" transform="translate(27 -5)" fill="#c93c5d"/>
    <path d="M103 60v32h26l12-21 16 43 18-34h29" fill="none" stroke="#0c6b86" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(52 265)">
    <rect width="328" height="142" rx="24" fill="#fff" stroke="#c3dce1" stroke-width="3"/>
    <text x="25" y="43" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#536b7a">Presión arterial</text>
    <text x="25" y="91" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#173e5d">−9</text>
    <text x="93" y="91" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#173e5d">mmHg</text>
    <text x="25" y="122" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6c7e8b">presión sistólica promedio</text>
    <path d="M215 103c38-23 67-52 88-83" fill="none" stroke="#2b9f7f" stroke-width="7" stroke-linecap="round"/>
    <path d="M286 33l19-13-2 23" fill="#2b9f7f"/>
  </g>

  <g transform="translate(52 430)">
    <circle cx="18" cy="18" r="18" fill="#2b9f7f"/>
    <path d="M10 18l6 6 12-15" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="25" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#3c596a">Ejercicio aeróbico regular</text>
  </g>
</g>

<!-- Woman 1 -->
<g transform="translate(210 235)" filter="url(#shadow)">
  <circle cx="205" cy="95" r="62" fill="#d9a278"/>
  <path d="M149 86c7-70 112-82 128-15 8 36-14 67-14 67s-4-39-29-47c-40 26-80 2-85-5z" fill="#d6d9dd"/>
  <path d="M169 128c18 17 56 18 75 0l-8 43h-59z" fill="#d9a278"/>
  <path d="M125 195c24-44 65-55 83-55 21 0 66 10 93 58l-16 192H145z" fill="url(#shirt1)"/>
  <path d="M142 215c-50 28-80 82-91 128" fill="none" stroke="#d9a278" stroke-width="34" stroke-linecap="round"/>
  <path d="M285 218c47 24 87 72 103 119" fill="none" stroke="#d9a278" stroke-width="34" stroke-linecap="round"/>
  <path d="M155 384c-23 48-56 115-80 178" fill="none" stroke="#183a57" stroke-width="52" stroke-linecap="round"/>
  <path d="M270 384c20 56 45 118 72 177" fill="none" stroke="#183a57" stroke-width="52" stroke-linecap="round"/>
  <ellipse cx="56" cy="570" rx="54" ry="20" fill="#172e45"/>
  <ellipse cx="360" cy="568" rx="54" ry="20" fill="#172e45"/>
  <path d="M55 340c20-5 45-3 70 8" fill="none" stroke="#f5f8fa" stroke-width="9" stroke-linecap="round" opacity=".8"/>
</g>

<!-- Woman 2 -->
<g transform="translate(505 285)" filter="url(#shadow)">
  <circle cx="185" cy="78" r="55" fill="#9d694d"/>
  <path d="M130 75c7-55 88-72 109-23 15 33 1 67-7 81-2-38-18-53-39-55-24 18-44 9-63-3z" fill="#f0f0ef"/>
  <path d="M153 118c13 14 44 15 59 1l-6 38h-47z" fill="#9d694d"/>
  <path d="M113 179c22-35 55-45 72-45 24 0 62 12 84 48l-15 175H130z" fill="url(#shirt2)"/>
  <path d="M127 196c-44 24-72 62-88 103" fill="none" stroke="#9d694d" stroke-width="30" stroke-linecap="round"/>
  <path d="M253 197c39 21 69 56 83 93" fill="none" stroke="#9d694d" stroke-width="30" stroke-linecap="round"/>
  <path d="M141 350c-19 42-41 91-58 137" fill="none" stroke="#224760" stroke-width="46" stroke-linecap="round"/>
  <path d="M236 350c17 46 37 95 58 137" fill="none" stroke="#224760" stroke-width="46" stroke-linecap="round"/>
  <ellipse cx="72" cy="495" rx="48" ry="18" fill="#173046"/>
  <ellipse cx="309" cy="495" rx="48" ry="18" fill="#173046"/>
</g>

<!-- motion lines -->
<g stroke="#2b8ea0" stroke-width="8" stroke-linecap="round" opacity=".55">
  <path d="M120 690c110-40 220-42 330-6"/>
  <path d="M490 735c90-30 180-28 260 4"/>
</g>

<!-- BP cuff icon -->
<g transform="translate(705 155)">
  <rect x="0" y="18" width="118" height="72" rx="22" fill="#f6fbfc" stroke="#4d9aaa" stroke-width="6"/>
  <circle cx="58" cy="54" r="23" fill="none" stroke="#0d5578" stroke-width="6"/>
  <path d="M58 54l14-10" stroke="#c93c5d" stroke-width="6" stroke-linecap="round"/>
  <path d="M118 53c38 0 50 12 50 44" fill="none" stroke="#4d9aaa" stroke-width="7" stroke-linecap="round"/>
</g>

<text x="70" y="846" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#173e5d">Ejercicio aeróbico • presión arterial • mujeres posmenopáusicas</text>
</svg>